# NOTE: authored here but not executed (no CI runner was available). Treat the first run as part of acceptance.
name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: edtech, POSTGRES_PASSWORD: edtech, POSTGRES_DB: edtech_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U edtech" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults: { run: { working-directory: platform/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: platform/api/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env: { DATABASE_URL: postgresql://edtech:edtech@localhost:5433/edtech_test }
      - run: npx tsc -p tsconfig.build.json --noEmit
      - name: Real ffmpeg and Docker for the live media and sandbox tests (otherwise they are skipped)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg openssl && docker pull python:3.12-alpine
      - name: Migration policy (expand/contract)
        run: npx ts-node scripts/migration-lint.ts
      - name: Tests with coverage (fails below the thresholds in package.json)
        run: npx jest --runInBand --coverage
        env: { TEST_DATABASE_URL: postgresql://edtech:edtech@localhost:5433/edtech_test, TEST_REDIS_URL: redis://localhost:6379 }
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: platform/api/coverage/lcov-report }
      - name: Dependency audit (runtime, fail on high)
        run: npm audit --omit=dev --audit-level=high
  infra:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -recursive -check
      - run: python3 scripts/check-references.py
      - name: Validate (downloads the AWS provider; no credentials needed)
        run: terraform init -backend=false -input=false && terraform validate
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: platform/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (runtime, fail on high)
        run: npm audit --omit=dev --audit-level=high
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Static analysis
        uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edtech-api:${{ github.sha }} platform/api
      - name: Container scan
        uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: "edtech-api:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
